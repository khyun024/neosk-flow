<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEOSK · 참여 게이트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f4f4f4;color:#111;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:420px;margin:0 auto;padding:24px 20px;flex:1;width:100%}
.tag{font-size:11px;color:#888;letter-spacing:.1em;margin-bottom:8px}
.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:24px 20px;text-align:center}
h1{font-size:20px;margin-bottom:10px}
.desc{font-size:14px;color:#555}
.big{font-size:52px;margin:14px 0 6px}
.state-ok h1{color:#0a7a2f}
.state-no h1{color:#b02020}
.sub{font-size:12px;color:#888;margin-top:14px}
.foot{padding:18px;text-align:center;font-size:11px;color:#bbb;user-select:none;-webkit-user-select:none}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">NEOSK · THE LINK · 참여 게이트</div>
  <div class="card" id="card">
    <div class="spin"></div>
    <h1>확인 중…</h1>
    <p class="desc">참여 이력을 확인하고 있습니다.</p>
  </div>
</div>
<div class="foot" id="staffZone">NEOSK GATE · v1</div>

<script>
/* 배포한 Apps Script 웹 앱 URL. QR 해시에 u 파라미터가 있으면 그 값을 우선 사용한다. */
const FALLBACK_SERVER = '';

/* gistpreview 호환: 파라미터는 해시(#sid=…&u=…)로 전달됨 */
const hp = new URLSearchParams(location.hash.replace(/^#/,''));
const SERVER = hp.get('u') || FALLBACK_SERVER;
const sid = hp.get('sid');
const isLocal = hp.get('local') || hp.get('demo'); /* 예시 모드: 서버 없이 휴대폰 안에서 1회 잠금 */
const LOCAL_PIN = '2426'; /* 예시 모드 스태프 PIN */

let token = localStorage.getItem('neosk_token');
if(!token){
  token = (crypto.randomUUID ? crypto.randomUUID() : 'tk-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  localStorage.setItem('neosk_token', token);
}

function render(cls, icon, title, desc, sub){
  document.getElementById('card').className = 'card ' + cls;
  document.getElementById('card').innerHTML =
    '<div class="big">'+icon+'</div><h1>'+title+'</h1><p class="desc">'+desc+'</p>'+(sub?'<p class="sub">'+sub+'</p>':'');
}
async function api(p){
  const r = await fetch(SERVER + '?' + new URLSearchParams(p));
  return r.json();
}
async function main(){
  if(isLocal){
    /* 예시 모드: 이 휴대폰(브라우저)에만 참여 기록을 남겨 1회 잠금을 시연한다 */
    const used = localStorage.getItem('neosk_used_at');
    if(!used){
      localStorage.setItem('neosk_used_at', new Date().toLocaleString('ko-KR'));
      render('state-ok', '✓', '참여 확인 완료', '키오스크가 곧 시작됩니다.<br>휴대폰을 내리고 화면 앞으로 이동해 주세요.',
        '이 휴대폰은 1회 참여 처리되었습니다.<br>(예시 모드 · 실제 운영에서는 이 순간 키오스크가 자동 시작)');
    }else{
      render('state-no', '✕', '이미 참여하셨습니다', 'NEOSK는 1인 1회 체험입니다.<br>키오스크가 시작되지 않습니다.',
        '참여 시각: ' + used + '<br>(하단 문구 3초 길게 누르면 스태프 초기화)');
    }
    return;
  }
  if(!SERVER){
    render('state-no', '⚠', '설정 필요', 'Apps Script 서버 URL이 지정되지 않았습니다. 키오스크 화면의 QR로 다시 접속해 주세요.');
    return;
  }
  if(!sid){
    render('state-no', '⚠', '잘못된 접근', '키오스크 대기화면의 QR을 스캔해 접속해 주세요.');
    return;
  }
  try{
    const res = await api({action:'unlock', sid:sid, token:token});
    if(res.result === 'ok'){
      render('state-ok', '✓', '참여 확인 완료', '키오스크가 곧 시작됩니다.<br>휴대폰을 내리고 화면 앞으로 이동해 주세요.', '이 휴대폰은 1회 참여 처리되었습니다.');
    } else if(res.result === 'already_used'){
      render('state-no', '✕', '이미 참여하셨습니다', 'NEOSK는 1인 1회 체험입니다.<br>키오스크가 시작되지 않습니다.', '참여 시각: ' + (res.usedAt || '기록 있음'));
    } else if(res.result === 'session_expired'){
      render('state-no', '⟳', '세션 만료', '키오스크 화면에 새로 표시된 QR을 다시 스캔해 주세요.');
    } else {
      render('state-no', '⚠', '오류', (res.error || '알 수 없는 응답') + '');
    }
  }catch(e){
    render('state-no', '⚠', '서버 연결 실패', '네트워크 상태를 확인한 뒤 QR을 다시 스캔해 주세요.');
  }
}
main();

/* 스태프 초기화: 하단 문구를 3초 길게 누르면 PIN 입력 → 이 휴대폰의 참여 기록 삭제 */
let pressT = null;
const zone = document.getElementById('staffZone');
['pointerdown','touchstart'].forEach(ev=>zone.addEventListener(ev, ()=>{
  pressT = setTimeout(async ()=>{
    const pin = prompt('스태프 PIN');
    if(pin === null) return;
    if(isLocal || !SERVER){
      /* 예시 모드: 휴대폰 안의 참여 기록 삭제 */
      if(pin !== LOCAL_PIN){ alert('PIN 불일치'); return; }
      localStorage.removeItem('neosk_used_at');
      alert('초기화 완료 · 이 휴대폰으로 다시 참여할 수 있습니다');
      location.reload();
      return;
    }
    try{
      const res = await api({action:'reset', token:token, pin:pin});
      if(res.result === 'ok') alert('초기화 완료 · 이 휴대폰으로 다시 참여할 수 있습니다 (' + res.removed + '건 삭제)');
      else if(res.result === 'bad_pin') alert('PIN 불일치');
      else alert('오류: ' + JSON.stringify(res));
    }catch(e){ alert('서버 연결 실패'); }
  }, 3000);
}));
['pointerup','pointerleave','touchend','touchcancel'].forEach(ev=>zone.addEventListener(ev, ()=>clearTimeout(pressT)));
</script>
</body>
</html>
